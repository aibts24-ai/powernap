<style>body{margin:0;background:#fff}*{box-sizing:border-box}.pn-hero{width:100vw;margin-left:calc(50% - 50vw);position:relative;overflow:hidden;background:linear-gradient(180deg,#FBF8F2,#FFFFFF 58%,#F8F4EC);font-family:Pretendard,sans-serif}.pn-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(820px 420px at 80% 8%,rgba(198,161,91,.20),transparent 62%),radial-gradient(620px 360px at 6% 92%,rgba(14,42,85,.07),transparent 60%);pointer-events:none}.pn-wrap{max-width:1240px;margin:0 auto;padding:0 28px;position:relative;z-index:1;box-sizing:border-box}.pn-hero-slider{max-width:1240px;margin:0 auto;padding:26px 28px 0;box-sizing:border-box;position:relative;z-index:2}.pn-sl{position:relative}.pn-r{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}.pn-stage{position:relative;width:100%;aspect-ratio:1672/941;overflow:hidden;background:#06152F;border:1px solid rgba(198,161,91,.55);box-shadow:0 20px 44px rgba(18,35,63,.12)}.pn-slide{position:absolute;inset:0;opacity:0;animation:pnFade 15s linear infinite}.pn-slide img{display:block;width:100%;height:100%;object-fit:cover}.pn-mo{display:none}.pn-s1{animation-delay:0s}.pn-s2{animation-delay:5s;background:#FFFFFF}.pn-s3{animation-delay:10s;background:#FFFFFF}@keyframes pnFade{0%{opacity:0}1%{opacity:1}31%{opacity:1}33.33%{opacity:0}100%{opacity:0}}.pn-sh{position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(100deg,transparent 42%,rgba(180,215,255,.22) 50%,transparent 58%);background-size:240% 100%;animation:pnSh 7s ease-in-out infinite}@keyframes pnSh{0%{background-position:170% 0}60%,100%{background-position:-80% 0}}.pn-nb{position:absolute;inset:0;z-index:5;pointer-events:none}.pn-set{position:absolute;inset:0;display:none}.pn-a0{display:block}.pn-set label{pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(8,18,38,.4);border:1px solid rgba(255,255,255,.55);color:#FFFFFF;font-size:24px;line-height:41px;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}.pn-set label:hover{background:rgba(8,18,38,.74)}.pn-set .pn-pv{left:13px}.pn-set .pn-nx{right:13px}.pn-dots{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:8px;padding:6px 11px;background:rgba(8,18,38,.34);border-radius:20px;z-index:6}.pn-dots .pn-d{display:block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer;animation:pnDot 15s linear infinite}.pn-d1{animation-delay:0s}.pn-d2{animation-delay:5s}.pn-d3{animation-delay:10s}@keyframes pnDot{0%{width:20px;border-radius:4px;background:#D9BE84}31%{width:20px;border-radius:4px;background:#D9BE84}33.33%{width:7px;border-radius:50%;background:rgba(255,255,255,.55)}100%{width:7px;border-radius:50%;background:rgba(255,255,255,.55)}}#pnh1:checked ~ .pn-stage .pn-slide,#pnh2:checked ~ .pn-stage .pn-slide,#pnh3:checked ~ .pn-stage .pn-slide{animation:none}#pnh1:checked ~ .pn-stage .pn-s1,#pnh2:checked ~ .pn-stage .pn-s2,#pnh3:checked ~ .pn-stage .pn-s3{opacity:1}#pnh1:checked ~ .pn-dots .pn-d,#pnh2:checked ~ .pn-dots .pn-d,#pnh3:checked ~ .pn-dots .pn-d{animation:none;width:7px;border-radius:50%;background:rgba(255,255,255,.55)}#pnh1:checked ~ .pn-dots .pn-d1,#pnh2:checked ~ .pn-dots .pn-d2,#pnh3:checked ~ .pn-dots .pn-d3{width:20px;border-radius:4px;background:#D9BE84}#pnh1:checked ~ .pn-stage .pn-a0,#pnh2:checked ~ .pn-stage .pn-a0,#pnh3:checked ~ .pn-stage .pn-a0{display:none}#pnh1:checked ~ .pn-stage .pn-a1,#pnh2:checked ~ .pn-stage .pn-a2,#pnh3:checked ~ .pn-stage .pn-a3{display:block}.pn-b1{animation:pnIn .9s ease-out both}@keyframes pnIn{from{opacity:0;transform:scale(1.02)}}.pn-hero-in{display:grid;grid-template-columns:1.04fr .96fr;gap:52px;align-items:center;padding-top:46px;padding-bottom:58px}.pn-eyebrow{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.32em;color
